name: Deploy to Supabase Main Branch

# This workflow deploys edge functions to Supabase main branch when dev is merged to main
# Required GitHub Secrets:
# - SUPABASE_ACCESS_TOKEN: Personal access token from Supabase Dashboard
# - SUPABASE_MAIN_PROJECT_ID: Project reference ID for your main/production Supabase project

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Main Branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MAIN_PROJECT_ID: ${{ secrets.SUPABASE_MAIN_PROJECT_ID }}
        run: supabase functions deploy --project-ref $SUPABASE_MAIN_PROJECT_ID

      - name: Notify deployment completion
        run: |
          echo "🚀 Edge functions deployed to Supabase main branch successfully!"
          echo "Production deployment completed for:"
          echo "  - delete-account"
          echo "  - send-quests"
          echo "✅ All functions are now live in production!"
