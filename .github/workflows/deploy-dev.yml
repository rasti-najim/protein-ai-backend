name: Deploy to Supabase Dev Branch

# This workflow deploys edge functions to Supabase when pushing to the dev branch
# Required GitHub Secrets:
# - SUPABASE_ACCESS_TOKEN: Personal access token from Supabase Dashboard
# - SUPABASE_PROJECT_ID: Project reference ID from Supabase Dashboard

on:
  push:
    branches: [dev]
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Dev Branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_ID

      - name: Notify deployment completion
        run: |
          echo "✅ Edge functions deployed to Supabase dev branch successfully!"
          echo "Functions deployed:"
          echo "  - delete-account"
          echo "  - send-quests"
